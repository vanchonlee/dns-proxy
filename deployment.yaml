---
apiVersion: v1
kind: ConfigMap
metadata:
  name: az-config
  namespace: kube-system
data:
  az_config.json: |
    {
      "azs": {
        "us-west-2a": ["10.0.0.0/24", "10.0.1.0/24"],
        "us-west-2b": ["10.0.2.0/24", "10.0.3.0/24"],
        "us-west-2c": ["10.0.4.0/24", "10.0.5.0/24"]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-proxy
  namespace: kube-system
  labels:
    app: dns-proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dns-proxy
  template:
    metadata:
      labels:
        app: dns-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dns-proxy
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: dns-proxy
        image: your-registry/dns-proxy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 53
          protocol: UDP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 53
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 53
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /app/az_config.json
          subPath: az_config.json
      volumes:
      - name: config
        configMap:
          name: az-config
---
apiVersion: v1
kind: Service
metadata:
  name: dns-proxy
  namespace: kube-system
spec:
  selector:
    app: dns-proxy
  ports:
    - protocol: UDP
      port: 53
      targetPort: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: default
  labels:
    app: nginx-proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nginx-proxy
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: nginx
          image: nginx:1.21-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - dns-proxy
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: nginx-proxy
